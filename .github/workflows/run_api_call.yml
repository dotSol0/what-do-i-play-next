name: IMSLP Batch Fetch v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: imslp-fetch-and-save
  cancel-in-progress: false

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read current offset
        id: offset
        run: echo "start=$(cat state/offset.txt)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run IMSLP fetch script
        env:
          START: ${{ steps.offset.outputs.start }}
          COUNT: 20000
          OUTPUT_PATH: data/processed/raw-full.csv
        run: |
          python3 scripts/run_api_call.py --start ${START} --count ${COUNT} --output ${OUTPUT_PATH} --append

      - name: Advance offset and commit
        run: |
          NEXT=$(( $(cat state/offset.txt) + 20000 ))
          echo $NEXT > state/offset.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/raw-full.csv state/offset.txt
          git diff --staged --quiet || git commit -m "chore: IMSLP batch $(cat state/offset.txt)"
          git push